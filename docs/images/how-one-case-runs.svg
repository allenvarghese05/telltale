<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="430" rx="16" fill="#ffffff"/>

  <text x="40" y="52" font-size="13" font-weight="600" fill="#57606a" letter-spacing="1.2">ONE REAL INVESTIGATION · HIGHWAY REAR-END, CAR</text>

  <!-- Step 1 -->
  <g>
    <circle cx="62" cy="104" r="16" fill="#0866FF"/>
    <text x="62" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="88" y="100" font-size="18" font-weight="700" fill="#1f2328">Watch</text>
    <text x="88" y="121" font-size="13" fill="#0866FF" font-weight="600">SAM 3.1</text>
    <rect x="40" y="146" width="250" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="60" y="176" font-size="14" fill="#57606a">Tracks every vehicle</text>
    <text x="60" y="198" font-size="14" fill="#57606a">in the dashcam footage.</text>
    <text x="60" y="236" font-size="22" font-weight="700" fill="#1f2328">6.13 s</text>
    <text x="60" y="260" font-size="13" fill="#57606a">the car ahead becomes a danger</text>
  </g>
  <line x1="298" y1="212" x2="328" y2="212" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g>
    <circle cx="358" cy="104" r="16" fill="#0866FF"/>
    <text x="358" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="384" y="100" font-size="18" font-weight="700" fill="#1f2328">Witness</text>
    <text x="384" y="121" font-size="13" fill="#0866FF" font-weight="600">Muse Spark 1.3</text>
    <rect x="336" y="146" width="250" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="356" y="176" font-size="14" fill="#57606a">Describes what the</text>
    <text x="356" y="198" font-size="14" fill="#57606a">camera saw.</text>
    <text x="356" y="236" font-size="22" font-weight="700" fill="#1f2328">Daylight, dry</text>
    <text x="356" y="260" font-size="13" fill="#57606a">confirmed on a second look</text>
  </g>
  <line x1="594" y1="212" x2="624" y2="212" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g>
    <circle cx="654" cy="104" r="16" fill="#0866FF"/>
    <text x="654" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="680" y="100" font-size="18" font-weight="700" fill="#1f2328">Investigate</text>
    <text x="680" y="121" font-size="13" fill="#0866FF" font-weight="600">Muse Wonder agent</text>
    <rect x="632" y="146" width="250" height="132" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="652" y="176" font-size="14" fill="#57606a">Reads the car's logs with</text>
    <text x="652" y="198" font-size="14" fill="#57606a">tools and names the cause.</text>
    <text x="652" y="236" font-size="22" font-weight="700" fill="#1f2328">Noticed too late</text>
    <text x="652" y="260" font-size="13" fill="#57606a">1.10 s to notice, 0.30 s allowed</text>
  </g>
  <line x1="890" y1="212" x2="920" y2="212" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g>
    <circle cx="950" cy="104" r="16" fill="#1a7f37"/>
    <text x="950" y="109" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="976" y="100" font-size="18" font-weight="700" fill="#1f2328">Check</text>
    <text x="976" y="121" font-size="13" fill="#1a7f37" font-weight="600">Plain Python, no AI</text>
    <rect x="928" y="146" width="232" height="132" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="948" y="176" font-size="14" fill="#1f2328">Redoes every number</text>
    <text x="948" y="198" font-size="14" fill="#1f2328">and the verdict itself.</text>
    <text x="948" y="236" font-size="22" font-weight="700" fill="#1a7f37">Verified</text>
    <text x="948" y="260" font-size="13" fill="#1f2328">9 of 9 claims reproduced</text>
  </g>

  <!-- Footer: what happens when it disagrees -->
  <line x1="40" y1="318" x2="1160" y2="318" stroke="#eaeef2"/>
  <rect x="40" y="342" width="12" height="12" rx="3" fill="#1a7f37"/>
  <text x="62" y="353" font-size="14" fill="#1f2328">Claim reproduced: it stays in the report.</text>
  <rect x="420" y="342" width="12" height="12" rx="3" fill="#cf222e"/>
  <text x="442" y="353" font-size="14" fill="#1f2328">Claim cannot be reproduced: it is blocked.</text>
  <rect x="810" y="342" width="12" height="12" rx="3" fill="#bf8700"/>
  <text x="832" y="353" font-size="14" fill="#1f2328">Verdicts disagree: held for a human.</text>
  <text x="40" y="396" font-size="12.5" fill="#8c959f">Numbers from the committed investigation cand36-car-s1775. The video and models are real; the car's logs are generated.</text>
</svg>
