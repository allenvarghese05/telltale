<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="440" fill="#ffffff"/>

  <!-- The finding: the gap between danger and detection -->
  <g stroke="#cf222e" stroke-width="1.5" fill="none">
    <line x1="224" y1="76" x2="702" y2="76"/>
    <line x1="224" y1="68" x2="224" y2="84"/>
    <line x1="702" y1="68" x2="702" y2="84"/>
  </g>
  <text x="463" y="58" font-size="15" text-anchor="middle" fill="#1f2328"><tspan fill="#cf222e" font-weight="600">1.10 s to notice the danger</tspan><tspan fill="#57606a">   ·   allowed 0.30 s</tspan></text>

  <!-- Time axis -->
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#1f2328" stroke-width="1.25"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8c959f" text-anchor="middle">
    <line x1="167" y1="180" x2="167" y2="186" stroke="#8c959f"/><text x="167" y="200">6.0 s</text>
    <line x1="384" y1="180" x2="384" y2="186" stroke="#8c959f"/><text x="384" y="200">6.5</text>
    <line x1="600" y1="180" x2="600" y2="186" stroke="#8c959f"/><text x="600" y="200">7.0</text>
    <line x1="817" y1="180" x2="817" y2="186" stroke="#8c959f"/><text x="817" y="200">7.5</text>
    <line x1="1033" y1="180" x2="1033" y2="186" stroke="#8c959f"/><text x="1033" y="200">8.0</text>
  </g>

  <!-- Events -->
  <g stroke="#1f2328" stroke-width="1">
    <line x1="224" y1="118" x2="224" y2="180"/>
    <line x1="702" y1="118" x2="702" y2="180"/>
    <line x1="735" y1="180" x2="735" y2="232"/>
    <line x1="791" y1="180" x2="791" y2="232"/>
    <line x1="1033" y1="118" x2="1033" y2="180"/>
  </g>
  <circle cx="224" cy="180" r="5" fill="#1f2328"/>
  <circle cx="702" cy="180" r="5" fill="#cf222e"/>
  <circle cx="735" cy="180" r="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <circle cx="791" cy="180" r="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <circle cx="1033" cy="180" r="5" fill="#1f2328"/>

  <g font-size="14" fill="#1f2328">
    <text x="230" y="116">The car ahead becomes a danger</text>
    <text x="696" y="116" text-anchor="end">The driver-assist notices it</text>
    <text x="729" y="254" text-anchor="end">Brakes commanded</text>
    <text x="797" y="254">Brakes engage</text>
    <text x="1027" y="116" text-anchor="end">Impact at 8.4 km/h</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#57606a">
    <text x="230" y="134">6.13 s · video, SAM 3.1</text>
    <text x="696" y="134" text-anchor="end">7.24 s · car log</text>
    <text x="729" y="272" text-anchor="end">7.31 s · car log</text>
    <text x="797" y="272">7.44 s · car log</text>
    <text x="1027" y="134" text-anchor="end">8.00 s · video</text>
  </g>

  <!-- Who concluded what -->
  <line x1="80" y1="318" x2="1120" y2="318" stroke="#d0d7de"/>
  <g font-size="14" font-weight="600" fill="#1f2328">
    <text x="80" y="346">SAM 3.1 and Muse Spark</text>
    <text x="440" y="346">Muse Wonder agent</text>
    <text x="800" y="346">Python checker</text>
  </g>
  <g font-size="13.5" fill="#57606a">
    <text x="80" y="370">Timed the danger from the video.</text>
    <text x="80" y="390">Witness: daylight, dry road.</text>
    <text x="440" y="370">Read the car's logs with tools.</text>
    <text x="440" y="390">Verdict: noticed the hazard too late.</text>
    <text x="800" y="370">Recomputed it without AI:</text>
    <text x="800" y="390"><tspan fill="#1a7f37" font-weight="600">same verdict</tspan>, 9 of 9 claims reproduced.</text>
  </g>
  <text x="80" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8c959f">cand36 · highway rear-end · real dashcam video, generated car logs</text>
</svg>
