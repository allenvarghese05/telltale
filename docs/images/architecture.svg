<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" rx="16" fill="#ffffff"/>

  <!-- Lane headers -->
  <g font-size="12.5" font-weight="700" letter-spacing="1.3">
    <text x="40" y="50" fill="#0866FF">PERCEIVE · META AI</text>
    <text x="330" y="50" fill="#57606a">EVIDENCE</text>
    <text x="620" y="50" fill="#0866FF">INVESTIGATE · META AI</text>
    <text x="910" y="50" fill="#1a7f37">VERIFY · PLAIN PYTHON</text>
  </g>
  <g stroke="#eaeef2" stroke-width="1.5">
    <line x1="40" y1="64" x2="270" y2="64"/>
    <line x1="330" y1="64" x2="560" y2="64"/>
    <line x1="620" y1="64" x2="850" y2="64"/>
    <line x1="910" y1="64" x2="1160" y2="64"/>
  </g>

  <!-- Perceive -->
  <rect x="40" y="96" width="230" height="78" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="128" font-size="16" font-weight="700" fill="#1f2328">Dashcam clip</text>
  <text x="60" y="152" font-size="13" fill="#57606a">real Nexar crash footage</text>

  <rect x="40" y="214" width="230" height="78" rx="12" fill="#eef4ff" stroke="#0866FF"/>
  <text x="60" y="246" font-size="16" font-weight="700" fill="#1f2328">SAM 3.1</text>
  <text x="60" y="270" font-size="13" fill="#57606a">tracks every vehicle</text>

  <rect x="40" y="332" width="230" height="78" rx="12" fill="#eef4ff" stroke="#0866FF"/>
  <text x="60" y="364" font-size="16" font-weight="700" fill="#1f2328">Muse Spark 1.3</text>
  <text x="60" y="388" font-size="13" fill="#57606a">video witness</text>

  <line x1="155" y1="176" x2="155" y2="210" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 40 135 Q 14 135 14 250 Q 14 371 36 371" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- Evidence -->
  <rect x="330" y="96" width="230" height="78" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="350" y="128" font-size="16" font-weight="700" fill="#1f2328">Car's own logs</text>
  <text x="350" y="152" font-size="13" fill="#57606a">CAN bus and ADAS</text>

  <rect x="330" y="214" width="230" height="196" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="350" y="248" font-size="16" font-weight="700" fill="#1f2328">Evidence store</text>
  <text x="350" y="274" font-size="13" fill="#57606a">hazard timing from video</text>
  <text x="350" y="296" font-size="13" fill="#57606a">witness answers</text>
  <text x="350" y="318" font-size="13" fill="#57606a">brake and speed logs</text>
  <rect x="350" y="352" width="190" height="34" rx="8" fill="#f6f8fa"/>
  <text x="445" y="374" font-size="12.5" fill="#1f2328" text-anchor="middle">immutable · SHA-256</text>

  <line x1="272" y1="253" x2="326" y2="270" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="272" y1="371" x2="326" y2="340" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="445" y1="176" x2="445" y2="210" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- Investigate -->
  <rect x="620" y="214" width="230" height="110" rx="12" fill="#eef4ff" stroke="#0866FF"/>
  <text x="640" y="248" font-size="16" font-weight="700" fill="#1f2328">Muse Wonder agent</text>
  <text x="640" y="274" font-size="13" fill="#57606a">6 tools for every number</text>
  <text x="640" y="296" font-size="13" fill="#57606a">decides the primary cause</text>

  <rect x="620" y="356" width="230" height="54" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="640" y="389" font-size="14" fill="#1f2328">claims + verdict</text>

  <line x1="562" y1="268" x2="616" y2="268" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="735" y1="326" x2="735" y2="352" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- Verify -->
  <rect x="910" y="214" width="250" height="196" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="930" y="248" font-size="16" font-weight="700" fill="#1f2328">Checker</text>
  <text x="930" y="274" font-size="13" fill="#1f2328">recomputes every claim</text>
  <text x="930" y="296" font-size="13" fill="#1f2328">rules R1 to R6</text>
  <text x="930" y="318" font-size="13" fill="#1f2328">recomputes the verdict itself</text>
  <text x="930" y="340" font-size="13" fill="#1f2328">with 1-D crash physics</text>

  <line x1="852" y1="383" x2="906" y2="370" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 445 412 Q 445 470 700 470 Q 1035 470 1035 414" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="740" y="492" font-size="12.5" fill="#1a7f37" text-anchor="middle">all facts, including the ones the agent never sees</text>

  <!-- Outputs -->
  <rect x="910" y="96" width="120" height="78" rx="12" fill="#ffffff" stroke="#1a7f37"/>
  <text x="970" y="128" font-size="14" font-weight="700" fill="#1a7f37" text-anchor="middle">Verified</text>
  <text x="970" y="150" font-size="12" fill="#57606a" text-anchor="middle">report published</text>
  <rect x="1040" y="96" width="120" height="78" rx="12" fill="#ffffff" stroke="#bf8700"/>
  <text x="1100" y="128" font-size="14" font-weight="700" fill="#9a6700" text-anchor="middle">Withheld</text>
  <text x="1100" y="150" font-size="12" fill="#57606a" text-anchor="middle">for human review</text>
  <line x1="1000" y1="212" x2="975" y2="178" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1070" y1="212" x2="1095" y2="178" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <text x="40" y="532" font-size="12.5" fill="#8c959f">The agent never sees the checker's physics or attribution facts, and can add facts only through its own tools.</text>
</svg>
