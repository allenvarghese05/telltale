<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1f2328" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>

  <!-- Tier labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8c959f">
    <text x="60" y="76">sources</text>
    <text x="60" y="186">perception</text>
    <text x="60" y="310">evidence</text>
    <text x="60" y="446">reasoning</text>
    <text x="60" y="586">output</text>
  </g>

  <!-- Boxes: hairline, square. Accent bar: blue = Meta AI, green = plain Python -->
  <g fill="#ffffff" stroke="#1f2328" stroke-width="1.25">
    <rect x="220" y="44" width="380" height="56"/>
    <rect x="800" y="44" width="340" height="56"/>
    <rect x="220" y="150" width="180" height="64"/>
    <rect x="420" y="150" width="180" height="64"/>
    <rect x="220" y="272" width="920" height="62"/>
    <rect x="220" y="408" width="380" height="68"/>
    <rect x="760" y="408" width="380" height="68"/>
    <rect x="760" y="556" width="180" height="48"/>
    <rect x="960" y="556" width="180" height="48"/>
  </g>
  <g>
    <rect x="220" y="150" width="4" height="64" fill="#0866FF"/>
    <rect x="420" y="150" width="4" height="64" fill="#0866FF"/>
    <rect x="220" y="408" width="4" height="68" fill="#0866FF"/>
    <rect x="760" y="408" width="4" height="68" fill="#1a7f37"/>
  </g>

  <!-- Box text -->
  <g font-size="15" font-weight="600" fill="#1f2328">
    <text x="240" y="78">Dashcam video</text>
    <text x="820" y="78">Car logs</text>
    <text x="240" y="177">SAM 3.1</text>
    <text x="440" y="177">Muse Spark 1.3</text>
    <text x="240" y="300">Evidence store</text>
    <text x="240" y="438">Muse Wonder agent</text>
    <text x="780" y="438">Checker</text>
    <text x="850" y="586" text-anchor="middle">Verified report</text>
    <text x="1050" y="586" text-anchor="middle">Held for a human</text>
  </g>
  <g font-size="13" fill="#57606a">
    <text x="372" y="78">real Nexar crash footage</text>
    <text x="902" y="78">CAN bus and ADAS</text>
    <text x="240" y="199">tracks every vehicle</text>
    <text x="440" y="199">video witness</text>
    <text x="240" y="320">every fact has an id and a source; the store is immutable and SHA-256 hashed</text>
    <text x="240" y="460">uses tools for every number, decides the primary cause</text>
    <text x="780" y="460">recomputes every claim and the verdict, rules R1 to R6</text>
  </g>

  <!-- Arrows -->
  <g stroke="#1f2328" stroke-width="1.1" fill="none" marker-end="url(#h)">
    <line x1="310" y1="100" x2="310" y2="146"/>
    <line x1="510" y1="100" x2="510" y2="146"/>
    <line x1="310" y1="214" x2="310" y2="268"/>
    <line x1="510" y1="214" x2="510" y2="268"/>
    <line x1="970" y1="100" x2="970" y2="268"/>
    <line x1="410" y1="334" x2="410" y2="404"/>
    <line x1="950" y1="334" x2="950" y2="404"/>
    <line x1="600" y1="442" x2="756" y2="442"/>
    <line x1="850" y1="476" x2="850" y2="552"/>
    <line x1="1050" y1="476" x2="1050" y2="552"/>
  </g>

  <!-- Arrow labels: the information boundary -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#57606a">
    <text x="420" y="374">only the facts the agent is allowed to see</text>
    <text x="960" y="366">all facts, including the physics</text>
    <text x="960" y="382">the agent never sees</text>
    <text x="678" y="432" text-anchor="middle">claims + verdict</text>
    <text x="860" y="524">agrees</text>
    <text x="1060" y="524">disagrees</text>
  </g>

  <!-- Legend -->
  <g font-size="12.5" fill="#57606a">
    <rect x="220" y="634" width="4" height="12" fill="#0866FF"/>
    <text x="232" y="645">Meta AI</text>
    <rect x="310" y="634" width="4" height="12" fill="#1a7f37"/>
    <text x="322" y="645">plain Python, no model</text>
  </g>
</svg>
