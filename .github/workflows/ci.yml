name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, dead code, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff, incl. bandit security rules)
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Dead code (vulture)
        run: vulture
      - name: Tests (no network, no API keys)
        env:
          MODEL_API_KEY: ""
        run: pytest -q --cov=telltale --cov-report=term-missing
