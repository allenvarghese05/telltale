[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telltale"
version = "0.1.0"
description = "Meta AI investigates vehicle crashes; a deterministic checker makes it auditable."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "cantools>=39",
  "mcap>=1.1",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn>=0.54.0",
  "python-dotenv>=1.0",
  "opencv-python-headless>=4.9",
  "imageio-ffmpeg>=0.5",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "vulture>=2.11",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

[project.scripts]
telltale = "telltale.cli:main"

[tool.setuptools.packages.find]
include = ["telltale*"]

[tool.setuptools.package-data]
telltale = ["logs/dbc/*.dbc", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF", "BLE"]
ignore = [
  "S603",    # subprocess with an argument list (never shell=True) is our only pattern
  "S311",    # random is used for seeded sampling, never for security
  "RUF001",  # typographic characters (en dashes, middle dots) in user-facing prose are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.vulture]
paths = ["telltale", "tests"]
min_confidence = 80
